<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taker</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <header>
    <h1>Note Taker</h1>
    <p>Organize your thoughts and ideas</p>
    <nav id="note-theme-container">
      <button id="theme-switcher" class="btn">Switch Theme</button>
    </nav>
    <nav id="note-dark-mode-container">
      <button id="toggle-dark-mode" class="btn">Toggle Dark Mode</button>
    </nav>
    <nav id="note-buttons">
      <button id="save-note" class="btn"><i class="fas fa-save"></i></button>
      <button id="new-note" class="btn"><i class="fas fa-pen"></i></button>
    </nav>
  </header>
  <main>
    <section id="note-container" class="note-container">
      <aside id="note-list-container" class="note-list">
        <h2>Your Notes</h2>
        <div id="note-search-container">
          <input type="text" id="search-bar" class="note-search" placeholder="Search notes...">
        </div>
        <ul class="list-group" id="note-list">
          <!-- Notes will be dynamically added here -->
        </ul>
        <div id="saved-notes-container">
          <h3>Saved Notes</h3>
          <ul class="list-group" id="saved-notes-list">
            <!-- Saved notes will be dynamically added here -->
          </ul>
        </div>
      </aside>
      <article id="note-editor" class="note-editor">
        <h2>New Note</h2>
        <form id="note-form">
          <input type="text" id="note-title" class="note-title" placeholder="Note Title">
          <textarea id="note-textarea" class="note-textarea" placeholder="Note Text"></textarea>
          <div id="note-preview" class="note-preview"></div>
        </form>
      </article>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Note Taker. All rights reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
        loadNotes();

        $('#save-note').click(function() {
            saveNote();
        });

        $('#new-note').click(function() {
            newNote();
        });

        $('#note-list').on('click', 'li', function() {
            const index = $(this).data('index');
            displayNoteContent(index);
        });

        $('#saved-notes-list').on('click', '.delete-note', function() {
            const index = $(this).parent().data('index');
            deleteNote(index);
        });
    });

    function saveNote() {
        const title = $('#note-title').val();
        const content = $('#note-textarea').val();
        if (title && content) {
            const notes = JSON.parse(localStorage.getItem('notes')) || [];
            notes.push({ title, content });
            localStorage.setItem('notes', JSON.stringify(notes));
            loadNotes();
            newNote();
        }
    }

    function loadNotes() {
        const notes = JSON.parse(localStorage.getItem('notes')) || [];
        $('#note-list').empty();
        $('#saved-notes-list').empty();
        notes.forEach((note, index) => {
            $('#note-list').append(`<li class="list-group-item" data-index="${index}">${note.title}</li>`);
            $('#saved-notes-list').append(`<li class="list-group-item" data-index="${index}">${note.title} <button class="delete-note btn btn-danger btn-sm">Delete</button></li>`);
        });
    }

    function newNote() {
        $('#note-title').val('');
        $('#note-textarea').val('');
    }

    function displayNoteContent(index) {
        const notes = JSON.parse(localStorage.getItem('notes')) || [];
        const note = notes[index];
        if (note) {
            $('#note-title').val(note.title);
            $('#note-textarea').val(note.content);
        }
    }

    function deleteNote(index) {
        let notes = JSON.parse(localStorage.getItem('notes')) || [];
        notes.splice(index, 1);
        localStorage.setItem('notes', JSON.stringify(notes));
        loadNotes();
    }
  </script>
</body>
</html>
