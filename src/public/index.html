<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taker</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <header>
    <h1>Welcome to Note Taker</h1>
    <p>Organize your thoughts and ideas</p>
  </header>
  <main>
    <section class="intro">
      <h2>Get Started</h2>
      <p>Click the button below to start taking notes.</p>
      <a href="notes.html" class="btn">Start Taking Notes</a>
    </section>
  </main>
  <footer>
    <p>&copy; <span id="year"></span> Note Taker. All rights reserved.</p>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
        $(window).unload(saveSettings);
        loadSettings();
    });

    function saveSettings() {
        localStorage.notes = $('#notes').html();
    }

    function loadSettings() {
        $('#notes').html(localStorage.notes);
    }
  </script>
</body>
</html>
